<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="icon" href="./images/weather.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <div class="left-side">
          <img src="./images/weather.png" alt="" />
          <div>
            <h1>Weather App</h1>
            <p>Check the weather anywhere</p>
          </div>
        </div>
        <form onsubmit="getWeather(event)">
          <div>
            <i class="fa-solid fa-location-dot"></i>
            <input type="text" placeholder="Enter city..." required />
          </div>
          <button type="submit">Search</button>
        </form>
      </header>
      <section class="weather-panel-sec">
        <div class="weather-panel">
          <div class="weather-date-row">
            <p id="city" class="city">
              <i class="fa-solid fa-location-dot"></i> Search a location
            </p>
            <p id="date" class="date">Enter a city to get live weather</p>
          </div>
          <div class="temperature-row">
            <div id="weatherIcon" class="weather-icon"></div>
            <div>
              <div class="temperature">
                <p id="temperature">--</p>
                <sup>°C</sup>
              </div>
              <p id="condition" class="condition">Waiting for location</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
